<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - AGUKA</title>
    <!-- Google Fonts: Kumbh Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kumbh Sans', 'sans-serif'],
                    },
                    colors: {
                        primary: '#06392F',
                        surface: '#EAE3D3',
                        background: '#06392F',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.6s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-surface font-sans antialiased min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden py-8">

    <!-- Decorative Background Elements -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-white/5 rounded-full filter blur-3xl animate-float" style="animation-delay: 0s;"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-80 h-80 bg-white/5 rounded-full filter blur-3xl animate-float" style="animation-delay: 2s;"></div>

    <!-- Main Container -->
    <main class="relative z-10 w-full max-w-lg p-4 sm:p-8 animate-fade-in">
        
        <!-- Premium Form Card -->
        <div class="bg-surface rounded-3xl shadow-[0_15px_40px_rgba(0,0,0,0.4)] border border-white/10 p-8 sm:py-12 sm:px-16 text-primary">
            
            <!-- Branding Header -->
            <div class="text-center mb-10">
                <h1 class="text-3xl tracking-tight font-extrabold text-primary mb-2">AGUKA</h1>
                <p class="text-primary/70 text-sm font-medium">Welcome back, please log in.</p>
            </div>

            <!-- Form -->
            <form action="/login" method="post" class="space-y-5">
                
                <!-- Email -->
                <div class="space-y-1.5 group">
                    <label for="email" class="block text-sm font-semibold text-primary/80 transition-colors group-focus-within:text-primary">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="username" 
                        placeholder="you@example.com" 
                        required
                        class="w-full px-4 py-3.5 bg-white/40 border border-primary/10 text-primary rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/40 focus:bg-white placeholder-primary/40 transition-all duration-300"
                    >
                </div>

                <!-- Password -->
                <div class="space-y-1.5 group">
                    <label for="password" class="block text-sm font-semibold text-primary/80 transition-colors group-focus-within:text-primary">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                        class="w-full px-4 py-3.5 bg-white/40 border border-primary/10 text-primary rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/40 focus:bg-white placeholder-primary/40 transition-all duration-300"
                    >
                </div>

                <!-- Options -->
                <div class="flex items-center justify-between py-2">
                    <label class="flex items-center space-x-2.5 cursor-pointer group">
                        <input type="checkbox" class="w-4 h-4 rounded border-primary/30 bg-white/50 text-primary focus:ring-primary/30 cursor-pointer transition-all">
                        <span class="text-sm font-medium text-primary/70 group-hover:text-primary transition-colors">Remember me</span>
                    </label>
                    <a href="#" class="text-sm font-semibold text-primary/90 hover:text-primary transition-colors">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <div class="pt-4 mt-2">
                    <button 
                        type="submit" 
                        class="w-full bg-primary hover:bg-opacity-90 hover:-translate-y-0.5 active:translate-y-0 text-surface font-bold py-3.5 px-6 rounded-xl shadow-[0_10px_20px_rgb(6,57,47,0.2)] hover:shadow-[0_10px_25px_rgb(6,57,47,0.3)] transition-all duration-300"
                    >
                        Sign In
                    </button>
                </div>
                
                <div class="mt-8 text-center text-sm font-medium text-primary/70">
                    Don't have an account? 
                    <a href="/auth/role-confirmation" class="text-primary hover:text-primary/90 font-bold ml-1 relative after:absolute after:bottom-0 after:left-0 after:w-full after:h-[2px] after:bg-primary after:scale-x-0 hover:after:scale-x-100 after:transition-transform after:origin-left">Register</a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
