<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Role - AGUKA</title>
    <!-- Google Fonts: Kumbh Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kumbh Sans', 'sans-serif'],
                    },
                    colors: {
                        primary: '#06392F',
                        surface: '#EAE3D3',
                        background: '#06392F',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.6s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-surface font-sans antialiased min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden py-8">

    <!-- Decorative Background Elements -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-white/5 rounded-full filter blur-3xl animate-float" style="animation-delay: 0s;"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-80 h-80 bg-white/5 rounded-full filter blur-3xl animate-float" style="animation-delay: 2s;"></div>

    <!-- Main Container -->
    <main class="relative z-10 w-full max-w-4xl p-4 sm:p-8 animate-fade-in">
        
        <!-- Branding Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl tracking-tight font-extrabold text-surface mb-3">Join AGUKA</h1>
            <p class="text-surface/80 text-base font-medium max-w-sm mx-auto">Select how you'll use the platform to customize your experience.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full">
            
            <!-- Client Card -->
            <a href="/auth/client" class="group relative bg-surface p-8 sm:py-12 sm:px-16 rounded-3xl shadow-[0_15px_40px_rgba(0,0,0,0.4)] border border-white/10 hover:shadow-[0_20px_50px_rgba(0,0,0,0.5)] hover:-translate-y-1 transition-all duration-300 flex flex-col items-center text-center overflow-hidden">
                <div class="w-16 h-16 bg-white/40 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-primary transition-colors duration-300 border border-primary/10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-primary group-hover:text-surface transition-colors duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                </div>
                <h2 class="text-xl font-bold text-primary mb-2">I'm a Client</h2>
                <p class="text-sm font-medium text-primary/70">I want to discover talent and post jobs for incredible engineers.</p>
                <!-- Highlight line at bottom -->
                <div class="absolute bottom-0 left-0 w-full h-1.5 bg-primary transform scale-x-0 group-hover:scale-x-100 origin-left transition-transform duration-300"></div>
            </a>

            <!-- Engineer Card -->
            <a href="/auth/engineer" class="group relative bg-surface p-8 sm:py-12 sm:px-16 rounded-3xl shadow-[0_15px_40px_rgba(0,0,0,0.4)] border border-white/10 hover:shadow-[0_20px_50px_rgba(0,0,0,0.5)] hover:-translate-y-1 transition-all duration-300 flex flex-col items-center text-center overflow-hidden">
                <div class="w-16 h-16 bg-white/40 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-primary transition-colors duration-300 border border-primary/10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-primary group-hover:text-surface transition-colors duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                    </svg>
                </div>
                <h2 class="text-xl font-bold text-primary mb-2">I'm an Engineer</h2>
                <p class="text-sm font-medium text-primary/70">I'm ready to showcase my skills and take on exciting projects.</p>
                <div class="absolute bottom-0 left-0 w-full h-1.5 bg-primary transform scale-x-0 group-hover:scale-x-100 origin-left transition-transform duration-300"></div>
            </a>

        </div>

        <div class="mt-12 text-center text-sm font-medium text-surface/80">
            Already have an account? 
            <a href="/auth/login" class="text-surface hover:text-white font-bold ml-1 relative after:absolute after:bottom-0 after:left-0 after:w-full after:h-[2px] after:bg-white after:scale-x-0 hover:after:scale-x-100 after:transition-transform after:origin-left">Log in</a>
        </div>

    </main>

</body>
</html>
