<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - UBAKA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111214;
            --card: #d8d5c8;
            --primary: #01493d;
            --primary-soft: #2d645a;
            --line: #266255;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            font-family: "Kumbh Sans", sans-serif;
            padding: 0.75rem;
        }

        .card {
            width: min(44rem, 100%);
            min-height: 96vh;
            margin: 0 auto;
            background: var(--card);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .top {
            background: var(--primary);
            color: #fff;
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            padding: 0.7rem 1rem;
        }

        .content {
            padding: 2rem 3.3rem;
            color: var(--primary);
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            line-height: 1.2;
        }

        .sub {
            margin-top: 0.45rem;
            color: var(--primary-soft);
            font-size: 1.2rem;
        }

        label {
            display: block;
            margin-top: 1.5rem;
            margin-bottom: 0.45rem;
            font-size: 1.7rem;
            color: var(--primary);
            font-weight: 500;
        }

        input {
            width: min(19rem, 100%);
            padding: 0.65rem 0.85rem;
            border-radius: 0.45rem;
            border: 2px solid var(--line);
            outline: none;
            background: rgba(255, 255, 255, 0.22);
            font-size: 1.35rem;
            color: var(--primary);
            font-family: inherit;
        }

        input::placeholder {
            color: #7b8d87;
        }

        input:focus {
            background: #fff;
            box-shadow: 0 0 0 3px rgba(45, 100, 90, 0.2);
        }

        button {
            margin-top: 0.55rem;
            width: min(19rem, 100%);
            border: none;
            border-radius: 0.45rem;
            background: var(--primary);
            color: #fff;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 0.68rem 0.9rem;
            cursor: pointer;
            text-transform: lowercase;
        }

        button:hover {
            opacity: 0.95;
        }

        .feedback {
            margin-top: 0.9rem;
            font-size: 1rem;
            color: var(--primary-soft);
            display: none;
        }

        .feedback.show {
            display: block;
        }

        @media (max-width: 700px) {
            .top {
                font-size: 1.55rem;
            }

            .content {
                padding: 1.25rem 1.25rem 2rem;
            }

            h1 {
                font-size: 1.55rem;
            }

            .sub {
                font-size: 1rem;
            }

            label {
                font-size: 1.1rem;
            }

            input,
            button {
                font-size: 1rem;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="top">UBAKA</div>
        <section class="content">
            <h1>Reset your password</h1>
            <p class="sub">Enter your email or phone number to receive a reset code.</p>

            <form id="resetPasswordForm" action="#" method="post">
                <label for="identifier">Email</label>
                <input id="identifier" name="identifier" type="text" placeholder="Enter your email" required>
                <button type="submit">send reset code</button>
                <p id="feedback" class="feedback">Reset code sent successfully.</p>
            </form>
        </section>
    </main>

    <script>
        const form = document.getElementById("resetPasswordForm");
        const feedback = document.getElementById("feedback");

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            feedback.classList.add("show");
        });
    </script>
</body>
</html>
