<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer Registration - AGUKA</title>
    <!-- Google Fonts: Kumbh Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kumbh Sans', 'sans-serif'],
                    },
                    colors: {
                        primary: '#06392F',
                        surface: '#EAE3D3',
                        background: '#06392F',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.6s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-surface font-sans antialiased min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden py-8">

    <!-- Decorative Background Elements -->
    <div class="absolute top-[-5%] left-[-5%] w-96 h-96 bg-white/5 rounded-full filter blur-3xl animate-float" style="animation-delay: 0s;"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-80 h-80 bg-white/5 rounded-full filter blur-3xl animate-float" style="animation-delay: 2s;"></div>

    <!-- Main Container -->
    <main class="relative z-10 w-full max-w-2xl p-4 sm:p-8 animate-fade-in my-8">
        
        <!-- Premium Form Card -->
        <div class="bg-surface rounded-3xl shadow-[0_15px_40px_rgba(0,0,0,0.4)] border border-white/10 p-8 sm:py-12 sm:px-20 text-primary">
            
            <!-- Branding Header -->
            <div class="text-center mb-8">
                <h1 class="text-2xl tracking-tight font-extrabold text-primary mb-1">AGUKA Engineers</h1>
                <p class="text-primary/70 text-sm font-medium">Join to find exciting projects and top clients.</p>
            </div>

            <!-- Form -->
            <form action="/register/engineer" method="post" class="space-y-4">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Email -->
                    <div class="space-y-1.5 group">
                        <label for="email" class="block text-sm font-semibold text-primary/80 transition-colors group-focus-within:text-primary">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email" 
                            required
                            class="w-full px-4 py-3 bg-white/40 border border-primary/10 text-primary rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/40 focus:bg-white placeholder-primary/40 transition-all duration-300"
                        >
                    </div>

                    <!-- Profession -->
                    <div class="space-y-1.5 group">
                        <label for="profession" class="block text-sm font-semibold text-primary/80 transition-colors group-focus-within:text-primary">Profession</label>
                        <input 
                            type="text" 
                            id="profession" 
                            name="profession" 
                            placeholder="civil engineer, architect, ..." 
                            required
                            class="w-full px-4 py-3 bg-white/40 border border-primary/10 text-primary rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/40 focus:bg-white placeholder-primary/40 transition-all duration-300"
                        >
                    </div>

                    <!-- Full Name -->
                    <div class="space-y-1.5 group">
                        <label for="fullName" class="block text-sm font-semibold text-primary/80 transition-colors group-focus-within:text-primary">Full name</label>
                        <input 
                            type="text" 
                            id="fullName" 
                            name="fullName" 
                            placeholder="Enter your full name" 
                            required
                            class="w-full px-4 py-3 bg-white/40 border border-primary/10 text-primary rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/40 focus:bg-white placeholder-primary/40 transition-all duration-300"
                        >
                    </div>

                    <!-- Years of experience -->
                    <div class="space-y-1.5 group">
                        <label for="experience" class="block text-sm font-semibold text-primary/80 transition-colors group-focus-within:text-primary">Years of experience</label>
                        <input 
                            type="number" 
                            id="experience" 
                            name="experience" 
                            placeholder="Enter number" 
                            required
                            class="w-full px-4 py-3 bg-white/40 border border-primary/10 text-primary rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/40 focus:bg-white placeholder-primary/40 transition-all duration-300"
                        >
                    </div>

                    <!-- Phone Number -->
                    <div class="space-y-1.5 group">
                        <label for="phone" class="block text-sm font-semibold text-primary/80 transition-colors group-focus-within:text-primary">Phone number</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            placeholder="Enter your number" 
                            required
                            class="w-full px-4 py-3 bg-white/40 border border-primary/10 text-primary rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/40 focus:bg-white placeholder-primary/40 transition-all duration-300"
                        >
                    </div>

                    <!-- Location -->
                    <div class="space-y-1.5 group">
                        <label for="location" class="block text-sm font-semibold text-primary/80 transition-colors group-focus-within:text-primary">Location</label>
                        <input 
                            type="text" 
                            id="location" 
                            name="location" 
                            placeholder="Enter city,district" 
                            required
                            class="w-full px-4 py-3 bg-white/40 border border-primary/10 text-primary rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/40 focus:bg-white placeholder-primary/40 transition-all duration-300"
                        >
                    </div>

                    <!-- Password -->
                    <div class="space-y-1.5 group">
                        <label for="password" class="block text-sm font-semibold text-primary/80 transition-colors group-focus-within:text-primary">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter password" 
                            required
                            class="w-full px-4 py-3 bg-white/40 border border-primary/10 text-primary rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/40 focus:bg-white placeholder-primary/40 transition-all duration-300"
                        >
                    </div>

                    <!-- Confirm Password -->
                    <div class="space-y-1.5 group">
                        <label for="confirmPassword" class="block text-sm font-semibold text-primary/80 transition-colors group-focus-within:text-primary">Confirm password</label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="Re-enter password" 
                            required
                            class="w-full px-4 py-3 bg-white/40 border border-primary/10 text-primary rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/40 focus:bg-white placeholder-primary/40 transition-all duration-300"
                        >
                    </div>
                </div>

                <!-- Terms Text -->
                <div class="pt-2 pb-1 text-center">
                    <label class="flex justify-center items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" required class="w-4 h-4 rounded border-primary/30 bg-white/50 text-primary focus:ring-primary/30 cursor-pointer transition-all">
                        <span class="text-xs font-semibold text-primary/70 group-hover:text-primary transition-colors">
                            I agree to the <a href="#" class="text-primary hover:text-primary/90 font-bold underline">Terms</a> & <a href="#" class="text-primary hover:text-primary/90 font-bold underline">Privacy Policy</a>
                        </span>
                    </label>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button 
                        type="submit" 
                        class="w-full bg-primary hover:bg-opacity-90 hover:-translate-y-0.5 active:translate-y-0 text-surface font-bold py-3.5 px-6 rounded-xl shadow-[0_10px_20px_rgb(6,57,47,0.2)] hover:shadow-[0_10px_25px_rgb(6,57,47,0.3)] transition-all duration-300"
                    >
                        Create Account
                    </button>
                </div>
                
                <div class="mt-6 text-center text-sm font-medium text-primary/70">
                    Already have an account? 
                    <a href="/auth/login" class="text-primary hover:text-primary/90 font-bold ml-1 relative after:absolute after:bottom-0 after:left-0 after:w-full after:h-[2px] after:bg-primary after:scale-x-0 hover:after:scale-x-100 after:transition-transform after:origin-left">Log in</a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
