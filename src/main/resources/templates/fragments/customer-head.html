<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">UBAKA</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kumbh Sans', 'sans-serif'],
                    },
                    colors: {
                        primary: '#06392F',
                        surface: '#EAE3D3',
                        accent: '#0a4f42',
                        muted: 'rgba(6, 57, 47, 0.7)',
                        borderline: 'rgba(6, 57, 47, 0.3)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out forwards',
                        'slide-up': 'slideUp 0.6s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-card {
                @apply bg-white/30 backdrop-blur-sm border border-borderline shadow-lg shadow-black/5 hover:shadow-black/10 hover:-translate-y-1 transition-all duration-300;
            }
            .glass-input {
                @apply bg-white/40 border-primary focus:border-primary focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all outline-none font-medium text-primary placeholder-muted/80;
            }
            .nav-link {
                @apply flex items-center px-10 py-4 text-white/80 no-underline text-base font-medium transition-colors hover:bg-white/5 hover:text-white relative;
            }
            .nav-link-active {
                @apply text-white bg-white/5 after:absolute after:left-0 after:top-0 after:h-full after:w-1 after:bg-surface after:rounded-r;
            }
        }
    </style>
</head>
<body>
</body>
</html>
