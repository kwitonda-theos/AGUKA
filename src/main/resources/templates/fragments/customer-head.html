<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">UBAKA</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kumbh Sans', 'sans-serif'],
                    },
                    colors: {
                        primary: '#06392F',
                        surface: '#EAE3D3',
                        accent: '#0a4f42',
                        muted: 'rgba(6, 57, 47, 0.7)',
                        borderline: 'rgba(6, 57, 47, 0.3)',
                        darkbg: '#121816',
                        darkcard: '#1a231f'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out forwards',
                        'slide-up': 'slideUp 0.6s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-card {
                @apply bg-white/30 dark:bg-darkcard/80 backdrop-blur-sm border border-borderline dark:border-white/5 shadow-lg shadow-black/5 dark:shadow-black/20 hover:shadow-black/10 dark:hover:shadow-black/40 hover:-translate-y-1 transition-all duration-300;
            }
            .glass-input {
                @apply bg-white/40 dark:bg-darkbg/60 border-primary dark:border-white/10 focus:border-primary dark:focus:border-white/30 focus:ring-2 focus:ring-primary/20 dark:focus:ring-white/10 focus:bg-white dark:focus:bg-darkcard transition-all outline-none font-medium text-primary dark:text-[#EAE3D3] placeholder-muted/80 dark:placeholder-white/40;
            }
            .nav-link {
                @apply flex items-center px-10 py-4 text-white/80 dark:text-white/70 no-underline text-base font-medium transition-colors hover:bg-white/5 dark:hover:bg-white/5 hover:text-white dark:hover:text-white relative;
            }
            .nav-link-active {
                @apply text-white dark:text-white bg-white/5 dark:bg-white/5 after:absolute after:left-0 after:top-0 after:h-full after:w-1 after:bg-surface dark:after:bg-[#EAE3D3] after:rounded-r;
            }
            
            /* Dark mode text overrides for readability */
            .dark .text-primary {
                color: #EAE3D3 !important;
            }
            .dark .text-muted {
                color: rgba(234, 227, 211, 0.7) !important;
            }
            .dark .bg-\[\#e2d9cd\] {
                background-color: #1a231f !important;
            }
        }
    </style>
</head>
<body>
</body>
</html>
