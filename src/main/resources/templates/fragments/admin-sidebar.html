<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Admin Sidebar Fragment -->
<aside th:fragment="sidebar(activeTab)" class="w-72 bg-primary text-white flex flex-col py-8 fixed h-screen left-0 top-0 z-10 shadow-2xl">
    <div class="text-[28px] font-bold px-10 mb-10 tracking-widest">
        UBAKA ADMIN
    </div>
    
    <ul class="flex-1 space-y-2">
        <li>
            <a href="/admin/dashboard" 
               th:class="'nav-link ' + (${activeTab == 'dashboard'} ? 'nav-link-active' : '')">
                <i class="ri-dashboard-line mr-4 text-xl opacity-90"></i>
                <span>Dashboard</span>
            </a>
        </li>
        <li>
            <a href="/admin/engineers" 
               th:class="'nav-link ' + (${activeTab == 'engineers'} ? 'nav-link-active' : '')">
                <i class="ri-user-settings-line mr-4 text-xl opacity-90"></i>
                <span>Engineers</span>
            </a>
        </li>
        <li>
            <a href="/admin/users" 
               th:class="'nav-link ' + (${activeTab == 'users'} ? 'nav-link-active' : '')">
                <i class="ri-group-line mr-4 text-xl opacity-90"></i>
                <span>All Users</span>
            </a>
        </li>
        <li>
            <a href="/admin/jobs" 
               th:class="'nav-link ' + (${activeTab == 'jobs'} ? 'nav-link-active' : '')">
                <i class="ri-briefcase-line mr-4 text-xl opacity-90"></i>
                <span>All Jobs</span>
            </a>
        </li>
        <li>
            <a href="/admin/assignments" 
               th:class="'nav-link ' + (${activeTab == 'assignments'} ? 'nav-link-active' : '')">
                <i class="ri-links-line mr-4 text-xl opacity-90"></i>
                <span>Assignments</span>
            </a>
        </li>
    </ul>

    <!-- Theme Control & Logout -->
    <div class="fixed top-12 right-12 z-50 flex items-center space-x-3">
        <button onclick="toggleTheme()" class="w-[46px] h-[46px] flex items-center justify-center rounded-full bg-[#EAE3D3] dark:bg-darkcard border border-black/5 dark:border-white/10 text-primary dark:text-[#EAE3D3] shadow-sm hover:shadow-md transition-all" title="Toggle Theme">
            <i class="ri-moon-line text-[22px]" id="theme-icon"></i>
        </button>
        <form th:action="@{/auth/logout}" method="post">
            <button type="submit" class="w-[46px] h-[46px] flex items-center justify-center rounded-full bg-red-500/10 border border-red-500/20 text-red-500 shadow-sm hover:shadow-md transition-all" title="Logout">
                <i class="ri-logout-box-r-line text-[22px]"></i>
            </button>
        </form>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                if (icon) {
                    icon.classList.remove('ri-sun-line');
                    icon.classList.add('ri-moon-line');
                }
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                if (icon) {
                    icon.classList.remove('ri-moon-line');
                    icon.classList.add('ri-sun-line');
                }
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            const icon = document.getElementById('theme-icon');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                if (icon) {
                    icon.classList.remove('ri-moon-line');
                    icon.classList.add('ri-sun-line');
                }
            }
        });
    </script>

    <div class="px-8 py-5 mx-6 bg-white/10 rounded-xl flex items-center border border-white/5 shadow-inner">
        <div class="w-10 h-10 rounded-full bg-[#d9d9d9] mr-4 shadow-sm flex items-center justify-center text-primary font-bold">A</div>
        <span class="font-semibold text-base text-white/90">Administrator</span>
    </div>
</aside>

</body>
</html>
