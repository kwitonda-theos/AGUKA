<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Sidebar Fragment -->
<aside th:fragment="sidebar(activeTab)" class="w-72 bg-primary text-white flex flex-col py-8 fixed h-screen left-0 top-0 z-10 shadow-2xl">
    <div class="text-[28px] font-bold px-10 mb-10 tracking-widest">
        UBAKA
    </div>
    
    <ul class="flex-1 space-y-2">
        <li>
            <a href="/customer/dashboard" 
               th:class="'nav-link ' + (${activeTab == 'dashboard'} ? 'nav-link-active' : '')">
                <i class="ri-dashboard-line mr-4 text-xl opacity-90"></i>
                <span th:text="#{nav.dashboard}">Dashboard</span>
            </a>
        </li>
        <li>
            <a href="/customer/my-jobs" 
               th:class="'nav-link ' + (${activeTab == 'my-jobs'} ? 'nav-link-active' : '')">
                <i class="ri-briefcase-line mr-4 text-xl opacity-90"></i>
                <span th:text="#{nav.my_jobs}">My jobs</span>
            </a>
        </li>
        <li>
            <a href="/customer/post-job" 
               th:class="'nav-link ' + (${activeTab == 'post-job'} ? 'nav-link-active' : '')">
                <i class="ri-add-circle-line mr-4 text-xl opacity-90"></i>
                <span th:text="#{nav.post_job}">Post a job</span>
            </a>
        </li>
        <li>
            <a href="/customer/engineers" 
               th:class="'nav-link ' + (${activeTab == 'engineers'} ? 'nav-link-active' : '')">
                <i class="ri-user-settings-line mr-4 text-xl opacity-90"></i>
                <span th:text="#{nav.engineers}">Engineers</span>
            </a>
        </li>
        <li>
            <a href="/customer/notifications" 
               th:class="'nav-link flex items-center justify-between ' + (${activeTab == 'notifications'} ? 'nav-link-active' : '')">
                <div class="flex items-center">
                    <i class="ri-notification-3-line mr-4 text-xl opacity-90"></i>
                    <span th:text="#{nav.notifications}">Notifications</span>
                </div>
                <span th:if="${unreadNotificationsCount != null and unreadNotificationsCount > 0}" 
                      class="bg-accent text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full shadow-sm" 
                      th:text="${unreadNotificationsCount}">3</span>
            </a>
        </li>
    </ul>

    <!-- Theme & Language Controls (Top Right Corner) -->
    <div class="fixed top-12 right-12 z-50 flex items-center space-x-3">
        
        <!-- Language Selector Dropdown -->
        <div class="relative group">
            <button class="flex items-center space-x-1.5 px-5 py-2.5 rounded-full bg-[#EAE3D3] dark:bg-darkcard border border-black/5 dark:border-white/10 text-primary dark:text-[#EAE3D3] shadow-sm hover:shadow-md transition-all cursor-pointer" title="Change Language">
                <i class="ri-translate-2 text-[20px]"></i>
                <span class="text-[15px] font-extrabold uppercase mt-0.5">EN</span>
            </button>
            
            <!-- Clean Languages Box (Shows on hover) -->
            <div class="absolute top-full right-0 mt-3 w-44 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 transform translate-y-2 group-hover:translate-y-0">
                <!-- invisible bridge to keep hover state active -->
                <div class="absolute -top-4 left-0 w-full h-4"></div>
                <div class="bg-white dark:bg-[#1a1a1a] rounded-xl shadow-2xl border border-black/5 dark:border-white/10 py-2 flex flex-col">
                    <a href="?lang=en" class="px-5 py-2.5 hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-[14px] font-semibold flex items-center justify-between text-gray-700 dark:text-gray-200">English <span class="text-xs font-bold opacity-50">EN</span></a>
                    <a href="?lang=fr" class="px-5 py-2.5 hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-[14px] font-semibold flex items-center justify-between text-gray-700 dark:text-gray-200">Français <span class="text-xs font-bold opacity-50">FR</span></a>
                    <a href="?lang=rw" class="px-5 py-2.5 hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-[14px] font-semibold flex items-center justify-between text-gray-700 dark:text-gray-200">Kinyarwanda <span class="text-xs font-bold opacity-50">RW</span></a>
                </div>
            </div>
        </div>

        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" class="w-[46px] h-[46px] flex items-center justify-center rounded-full bg-[#EAE3D3] dark:bg-darkcard border border-black/5 dark:border-white/10 text-primary dark:text-[#EAE3D3] shadow-sm hover:shadow-md transition-all" title="Toggle Theme">
            <i class="ri-moon-line text-[22px]" id="theme-icon"></i>
        </button>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                if (icon) {
                    icon.classList.remove('ri-sun-line');
                    icon.classList.add('ri-moon-line');
                }
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                if (icon) {
                    icon.classList.remove('ri-moon-line');
                    icon.classList.add('ri-sun-line');
                }
            }
        }
        
        // Initialize theme on load
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            const icon = document.getElementById('theme-icon');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                if (icon) {
                    icon.classList.remove('ri-moon-line');
                    icon.classList.add('ri-sun-line');
                }
            }
        });
    </script>

    <!-- Profile Menu -->
    <div class="relative group mt-auto mb-2 mx-6">
        <div class="px-6 py-4 bg-white/10 rounded-xl flex items-center cursor-pointer hover:bg-white/15 transition-colors border border-white/5 shadow-inner">
            <div class="w-10 h-10 rounded-full bg-[#d9d9d9] mr-4 shadow-sm flex items-center justify-center overflow-hidden">
                <i class="ri-user-fill text-primary/50 text-xl"></i>
            </div>
            <div class="flex flex-col flex-1 overflow-hidden">
                <span class="font-semibold text-[15px] text-white/90 truncate" th:text="#{nav.profile}">Profile</span>
                <span class="text-[12px] font-medium text-white/50 truncate" sec:authentication="name">user@email.com</span>
            </div>
            <i class="ri-arrow-up-s-line text-white/50 group-hover:text-white transition-colors ml-2"></i>
        </div>

        <!-- Dropdown Menu -->
        <div class="absolute bottom-full left-0 mb-3 w-full opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 transform translate-y-2 group-hover:translate-y-0 z-50">
            <!-- Invisible bridge to keep hover active -->
            <div class="absolute -bottom-4 left-0 w-full h-4"></div>
            
            <div class="bg-white dark:bg-darkcard rounded-xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.3)] border border-black/5 dark:border-white/10 py-2 flex flex-col text-primary dark:text-[#EAE3D3] overflow-hidden">
                <div class="px-5 py-3 border-b border-black/5 dark:border-white/10 bg-black/5 dark:bg-white/5">
                    <p class="text-[11px] font-bold uppercase tracking-wider text-muted mb-0.5">Signed in as</p>
                    <p class="text-[13px] font-bold truncate" sec:authentication="name">user@email.com</p>
                </div>
                <div class="py-1">
                    <form th:action="@{/auth/logout}" method="post" class="w-full m-0 p-0">
                        <button type="submit" class="w-full px-5 py-2.5 text-left hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors text-[14px] font-bold text-red-600 dark:text-red-400 flex items-center group/item cursor-pointer">
                            <i class="ri-logout-box-r-line mr-3 text-[18px] text-red-500/70 group-hover/item:text-red-600 dark:group-hover/item:text-red-400 transition-colors"></i>
                            Log out
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</aside>

</body>
</html>
