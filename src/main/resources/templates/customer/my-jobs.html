<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/customer-head :: head('My Jobs - UBAKA')}"></head>
<body class="bg-surface dark:bg-darkbg text-primary dark:text-[#EAE3D3] flex min-h-screen overflow-x-hidden antialiased">

    <!-- Sidebar -->
    <th:block th:replace="~{fragments/customer-sidebar :: sidebar('my-jobs')}"></th:block>

    <!-- Main Content Area -->
    <main class="ml-72 flex-1 p-12 flex flex-col animate-fade-in relative z-0">
        
        <!-- Header -->
        <header class="mb-10">
            <h1 class="text-3xl font-extrabold mb-2 tracking-tight" th:text="#{nav.my_jobs}">My jobs</h1>
            <p class="text-muted text-base font-medium" th:text="#{my_jobs.subtitle}">Manage and track all your active and past service requests.</p>
        </header>

        <!-- Filters Section -->
        <div class="inline-flex bg-[#e2d9cd] p-1.5 rounded-xl mb-12 shadow-inner self-start animate-slide-up">
            <button class="px-6 py-2.5 rounded-lg text-sm font-bold text-primary bg-white shadow-sm hover:shadow-md transition-all" th:text="#{my_jobs.filters.all}">ALL</button>
            <button class="px-6 py-2.5 rounded-lg text-sm font-bold text-muted hover:text-primary hover:bg-white/40 transition-colors" th:text="#{my_jobs.filters.open}">Open</button>
            <button class="px-6 py-2.5 rounded-lg text-sm font-bold text-muted hover:text-primary hover:bg-white/40 transition-colors" th:text="#{my_jobs.filters.in_progress}">In progress</button>
            <button class="px-6 py-2.5 rounded-lg text-sm font-bold text-muted hover:text-primary hover:bg-white/40 transition-colors" th:text="#{my_jobs.filters.completed}">Completed</button>
            <button class="px-6 py-2.5 rounded-lg text-sm font-bold text-muted hover:text-primary hover:bg-white/40 transition-colors" th:text="#{my_jobs.filters.cancelled}">Cancelled</button>
        </div>

        <!-- Jobs List -->
        <div class="flex flex-col gap-6 max-w-5xl animate-slide-up" style="animation-delay: 0.1s;">
            
            <div th:each="job : ${jobs}" class="glass-card rounded-2xl p-7 flex flex-col gap-5 group">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <span th:if="${job.status.name() == 'IN_PROGRESS'}" class="px-3 py-1 bg-[#C0D1FF] text-[#2f54eb] rounded-md text-xs font-bold uppercase tracking-wide">In progress</span>
                        <span th:if="${job.status.name() == 'COMPLETED'}" class="px-3 py-1 bg-[#A2E4B8] text-[#13773b] rounded-md text-xs font-bold uppercase tracking-wide">Completed</span>
                        <span th:unless="${job.status.name() == 'IN_PROGRESS' or job.status.name() == 'COMPLETED'}" class="px-3 py-1 bg-[#CFD1D4] text-[#5c6269] rounded-md text-xs font-bold uppercase tracking-wide" th:text="${job.status.name()}">Open</span>
                        <span class="text-sm text-muted font-medium" th:text="'Created on ' + ${#temporals.format(job.createdAt, 'dd/MM/yyyy')}">Created on 23/3/2026</span>
                    </div>
                    <div class="text-[11px] font-bold text-muted uppercase tracking-wider" th:text="#{label.budget}">TOTAL BUDGET</div>
                </div>
                
                <div class="flex justify-between items-center">
                    <h3 class="text-2xl font-extrabold group-hover:text-accent transition-colors" th:text="${job.title}">Job Title</h3>
                    <div class="text-2xl font-black text-primary" th:text="${job.budget} != null ? ${job.budget} + ' FRW' : 'TBD'">1,200,000 FRW</div>
                </div>
                
                <div class="flex justify-between items-center pt-2">
                    <div class="flex items-center gap-6">
                        <div class="flex items-center gap-2 text-sm text-muted font-medium">
                            <i class="ri-map-pin-2-line text-lg"></i> <span th:text="${job.location}">kicukiro, Kigali</span>
                        </div>
                        <div class="flex items-center gap-2 text-sm text-muted font-medium" th:if="${job.assignment != null}">
                            <i class="ri-user-smile-line text-lg"></i> <span th:text="${job.assignment.engineer.user.fullName}">eng. raul</span>
                        </div>
                        <div class="flex items-center gap-2 text-sm text-muted font-medium" th:unless="${job.assignment != null}">
                            Awaiting Contractor
                        </div>
                    </div>
                    <div class="flex items-center gap-6">
                        <a th:href="@{/customer/engineers(jobId=${job.id})}" class="text-sm font-bold text-primary hover:text-accent underline-offset-4 hover:underline transition-all" th:text="#{button.view_engineers}">View engineers</a>
                        <button class="px-6 py-2.5 bg-primary text-white text-sm font-bold rounded-lg shadow-md hover:bg-accent hover:-translate-y-0.5 hover:shadow-lg transition-all" th:text="#{button.view_details}">View Details</button>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(jobs)}" class="text-muted font-medium italic" th:text="#{empty.no_jobs}">No jobs found. Post a new job to get started!</div>
        </div>

    </main>

</body>
</html>
