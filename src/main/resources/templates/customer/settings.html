<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/customer-head :: head('Settings - UBAKA')}"></head>
<body class="bg-surface text-primary flex min-h-screen overflow-x-hidden antialiased">

    <!-- Sidebar -->
    <th:block th:replace="~{fragments/customer-sidebar :: sidebar('settings')}"></th:block>

    <!-- Main Content Area -->
    <main class="ml-72 flex-1 p-12 flex flex-col animate-fade-in relative z-0">
        
        <!-- Header -->
        <header class="mb-10">
            <h1 class="text-3xl font-extrabold mb-1 tracking-tight">Settings</h1>
            <p class="text-muted text-base font-medium">configure UBAKA to your liking</p>
        </header>

        <!-- Settings Card -->
        <div class="glass-card rounded-2xl p-10 max-w-2xl bg-white/20 animate-slide-up">
            
            <div class="flex items-center gap-4 mb-8">
                <i class="ri-palette-line text-3xl text-primary"></i>
                <h2 class="text-[18px] font-bold text-primary">System preferences</h2>
            </div>
            
            <form action="#" method="post" class="space-y-6">
                <div class="space-y-2 group">
                    <label class="block text-[15px] font-bold text-primary" for="theme">Theme</label>
                    <div class="relative">
                        <select id="theme" class="glass-input w-full p-3.5 rounded-xl appearance-none cursor-pointer">
                            <option value="light" selected>Light</option>
                            <option value="dark">Dark</option>
                            <option value="system">System Default</option>
                        </select>
                        <i class="ri-arrow-down-s-line absolute right-4 top-1/2 transform -translate-y-1/2 text-muted pointer-events-none text-xl"></i>
                    </div>
                </div>
                
                <div class="space-y-2 group">
                    <label class="block text-[15px] font-bold text-primary" for="language">Language</label>
                    <div class="relative">
                        <select id="language" class="glass-input w-full p-3.5 rounded-xl appearance-none cursor-pointer">
                            <option value="en" selected>english</option>
                            <option value="fr">français</option>
                            <option value="rw">kinyarwanda</option>
                        </select>
                        <i class="ri-arrow-down-s-line absolute right-4 top-1/2 transform -translate-y-1/2 text-muted pointer-events-none text-xl"></i>
                    </div>
                </div>
                
                <div class="space-y-2 group">
                    <label class="block text-[15px] font-bold text-primary" for="auto-refresh">Auto refresh interval</label>
                    <div class="relative">
                        <select id="auto-refresh" class="glass-input w-full p-3.5 rounded-xl appearance-none cursor-pointer">
                            <option value="15">15 s</option>
                            <option value="30" selected>30 s</option>
                            <option value="60">1 min</option>
                            <option value="0">Off</option>
                        </select>
                        <i class="ri-arrow-down-s-line absolute right-4 top-1/2 transform -translate-y-1/2 text-muted pointer-events-none text-xl"></i>
                    </div>
                </div>
            </form>
            
        </div>

    </main>

</body>
</html>
